name: NextBrain research checks
on:
  push:
    paths:
      - 'src/nextbrain_research/**'
      - 'scripts/run_research.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/research.yml'
  pull_request:
    paths:
      - 'src/nextbrain_research/**'
      - 'scripts/run_research.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_research.py all
      - run: python -m pytest -q --junitxml=results/logs/pytest.xml
      - run: python scripts/run_research.py report
      - uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.os }}
          path: |
            results/
            NEXTBRAIN_RESEARCH_REPORT.md
            PROJECT_STATUS.md
