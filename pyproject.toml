[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nextbrain-research"
version = "0.1.0"
description = "NextBrain hard-atlas inspection and synthetic educational experiments"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy==2.2.6", "pandas==2.3.3", "scipy==1.15.3", "nibabel==5.3.2", "matplotlib==3.10.7", "scikit-learn==1.7.2"]
[project.scripts]
nextbrain-research = "nextbrain_research.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
include = ["nextbrain_research*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
